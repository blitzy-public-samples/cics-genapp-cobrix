# dbt_project.yml
# Project manifest for the GenApp Policy-Issue cloud-warehouse bridge.
# Single dbt project of the bridge; its models, macros and singular tests will
# resolve through this file.
# Milestone status: macros/generate_schema_name.sql, profiles.example.yml and the source
# declaration models/staging/genapp_class_exemplar/_genapp__sources.yml are the other
# project members present. The model tree and the singular tests are planned
# deliverables, not present at this milestone. Every model and test statement below
# states the target configuration, not observed behavior.
# Planned to run unchanged on Amazon Redshift and DuckDB.
# Diagram reference: Figure 4 — dbt Transformation DAG and Field Allocation
# in modernization/docs/architecture.md.
# Rationale for every choice in this file:
# modernization/docs/decision-log.md (planned deliverable; not present at this milestone)

name: genapp_rqi
version: '1.0.0'
config-version: 2

# Connection profile. Matches the top-level profile block name of
# profiles.example.yml.
profile: genapp_rqi

# Authored directories of this project. macros and the models tree, which holds the
# source declaration, are present at this milestone; tests is a planned directory.
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

# Directories removed by dbt clean.
clean-targets: ["target", "dbt_packages"]

# Supported dbt-core range. Matches the dbt-core pin in modernization/requirements.txt.
require-dbt-version: [">=1.12.0", "<1.13.0"]

# Per-layer defaults for the planned model tree, keyed by project name and then by
# model directory. dbt will pass each +schema value verbatim to the
# generate_schema_name macro in macros/generate_schema_name.sql, which returns the
# literal schemas staging, intermediate and canonical on both adapters.
# Each planned mart will set its own relation alias in its own model config block.
models:
  genapp_rqi:
    staging:
      genapp_class_exemplar:
        +materialized: view
        +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      canonical:
        +materialized: table
        +schema: canonical
