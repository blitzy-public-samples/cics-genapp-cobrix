# dbt_project.yml
# Project manifest for the GenApp Policy-Issue cloud-warehouse bridge.
# Single dbt project of the bridge; its models, macros and singular tests resolve
# through this file.
# Runs unchanged on Amazon Redshift and DuckDB.
# Diagram reference: Figure 4, dbt Transformation DAG and Field Allocation,
# in modernization/docs/architecture.md.
# Rationale for every choice in this file: modernization/docs/decision-log.md

name: genapp_rqi
version: '1.0.0'
config-version: 2

# Connection profile. Matches the top-level profile block name in profiles.example.yml.
profile: genapp_rqi

# Authored directories of this project.
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

# Directories removed by dbt clean.
clean-targets: ["target", "dbt_packages"]

# Supported dbt-core range. Matches the dbt-core pin in modernization/requirements.txt.
require-dbt-version: [">=1.12.0", "<1.13.0"]

# Per-layer defaults, keyed by project name and then by model directory.
# Each +schema value is passed verbatim to the generate_schema_name macro in
# macros/generate_schema_name.sql, which yields the literal schemas staging,
# intermediate and canonical on both adapters.
# Each mart sets its own relation alias in its own model config block.
models:
  genapp_rqi:
    staging:
      genapp_class_exemplar:
        +materialized: view
        +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      canonical:
        +materialized: table
        +schema: canonical
