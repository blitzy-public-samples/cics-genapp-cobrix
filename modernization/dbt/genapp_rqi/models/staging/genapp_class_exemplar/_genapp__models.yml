# _genapp__models.yml
# Model properties for stg_genapp__policy_issue, the only model of the models/staging subtree
# of the GenApp Policy-Issue cloud-warehouse bridge. This file carries that model's
# descriptions, its generic data tests and its source-lineage metadata. dbt discovers this file
# through the model-paths entry of modernization/dbt/genapp_rqi/dbt_project.yml; nothing
# imports it.
# The documented column set is exactly the output of stg_genapp__policy_issue.sql beside this
# file: 17 columns, carrying the warehouse-assigned source_system_key and the 16 runtime
# business values one execution of the named chain produces. Column names, column order and
# every lineage fact below are those of modernization/extraction/copybook_field_map.yml, the
# naming authority for this contract; the per-column config.meta keys reuse that map's own
# logical_entry and runtime_status vocabulary.
# Nullability follows modernization/landing/landing-schema.json: seven columns are never null
# in a landed record and ten accept null. Each key of a landed record is always present; a key
# present with a null value reaches its column as SQL NULL. Nullability is asserted by the
# not_null data tests below. No column constraint is declared: this model materializes as a
# view, and dbt reports Constraint types are not supported for view materializations.
# Landed contract: only a successful record is landed.
# modernization/extraction/extract_commarea.py rejects every returned CA-RETURN-CODE other
# than 00, so every row this model reads carries return code 00 and each column documented
# below as never null holds a value.
# The view materialization and the staging schema come from the
# models/staging/genapp_class_exemplar key of dbt_project.yml and are not restated here.
# Enforced contract — contract.enforced is set for this model, so dbt compares the name, data
# type and number of columns the model emits with the 17 columns declared below before
# materializing it, and fails the model on an extra column, a missing column or a column at
# another data type. Each column declares the VARCHAR width its column carries in
# modernization/warehouse/ddl/02_raw_genapp_policy_issue.sql, which the model casts to. Every
# value of this layer is text; type conversion is applied by the models of models/intermediate.
# Every data test below is a dbt built-in test. This project declares no packages.yml and no
# dbt package.
# Landed rows are successful executions only: modernization/extraction/extract_commarea.py
# refuses a record whose returned CA-RETURN-CODE is not 00, so return_code holds 00 in every
# row of this model and every not_null test below is satisfied by the landing contract.
# Applied unchanged on Amazon Redshift and DuckDB.
# Diagram reference: Figure 4 — dbt Transformation DAG and Field Allocation
# in modernization/docs/architecture.md.
# Rationale for every choice in this file: modernization/docs/decision-log.md

version: 2

models:
  - name: stg_genapp__policy_issue
    config:
      contract:
        enforced: true
    description: >-
      Staging projection of the GenApp Policy-Issue landing record. The model reads the only
      dbt source of this project, raw.genapp_policy_issue, declared in _genapp__sources.yml
      beside this file, and emits the same 17 columns under the same names and in the same
      order as the landing.field_order block of modernization/extraction/copybook_field_map.yml:
      the warehouse-assigned source_system_key and the 16 runtime business values one execution
      of the LGAPOL01, LGAPDB01 and LGAPVS01 policy-issue chain produces. No column is added
      and no column is dropped. Each column is named explicitly, leading and trailing
      whitespace is removed from each value, a value holding only whitespace becomes null, and
      each value is cast to the VARCHAR width its column declares in
      modernization/warehouse/ddl/02_raw_genapp_policy_issue.sql. Every value stays text; type
      conversion is applied by the models of models/intermediate and none is applied here. The
      grain is one output row per landed row, unchanged from the source
      relation: no row is combined, no row is removed and no row is added, and the motor sample
      row and the commercial sample row both reach the output. Every landed row carries return
      code 00, because modernization/extraction/extract_commarea.py refuses a record whose
      returned CA-RETURN-CODE is not 00, and the models of models/marts/canonical restate that
      filter on their own reads. The model derives no value: policy_type, the
      ISO-8601 last_changed and the product-specific premium null pattern are already applied
      by modernization/extraction/extract_commarea.py before landing, and no amount is derived
      anywhere in the bridge. policy_number, policy_type and last_changed are the three values
      the chain assigns rather than receives: a row carrying return_code 00 carries all three,
      and a row carrying any other return code can carry null in any of them, so no not_null
      test is declared on them at this layer and the not_null constraints of the two canonical
      relations apply to their return_code 00 rows. Two source constructs contribute no column
      of this model. The four commercial peril declarations CA-B-FirePeril, CA-B-CrimePeril,
      CA-B-FloodPeril and CA-B-WeatherPeril, each PIC 9(4) at base/src/lgcmarea.cpy:84, :86,
      :88 and :90, are code items and not amount items, and no column carries one; the amount
      items documented below are the adjacent PIC 9(8) premium declarations at
      base/src/lgcmarea.cpy:85, :87, :89 and :91.
      No column derives from base/src/lgapvs01.cbl: its commercial projection carries
      WF-B-Postcode, WF-B-Status and WF-B-Customer at base/src/lgapvs01.cbl:32-34, its motor
      projection carries WF-M-MAKE, WF-M-MODEL, WF-M-VALUE and WF-M-REGNUMBER at
      base/src/lgapvs01.cbl:48-51, neither projection carries a premium, and the 64-byte
      KSDSPOLY record it writes with the 21-byte composite key declared at
      base/src/lgapvs01.cbl:26-29 corroborates chain completion in the harness diff only.

    columns:

      - name: source_system_key
        data_type: varchar(64)
        description: >-
          Source-system discriminator assigned by the warehouse. No COBOL item supplies it:
          this is the sole warehouse-assigned column of the record, and its evidence is the
          user requirement rather than a source locator. The value
          modernization/extraction/extract_commarea.py writes for this exemplar is
          GENAPP_CLASS_EXEMPLAR. The same value is the leading element of the S3 key prefix and
          the first element of the natural key (source_system_key, policy_number) both raw
          loaders guard on. Trimmed text; never null.
        config:
          meta:
            logical_entry: source_system_key
            runtime_status: warehouse_assigned
            commarea_item: null
            commarea_locator: null
            db2_item: null
            db2_locator: null
        data_tests:
          - not_null

      - name: policy_number
        data_type: varchar(10)
        description: >-
          Policy number recovered after the policy insert. CA-POLICY-NUM PIC 9(10),
          base/src/lgcmarea.cpy:35. The policy insert supplies DEFAULT for POLICYNUMBER at
          base/src/lgapdb01.cbl:279, IDENTITY_VAL_LOCAL() loads the integer host variable
          DB2-POLICYNUM-INT PIC S9(9) COMP at base/src/lgapdb01.cbl:308-310, and
          base/src/lgapdb01.cbl:311 moves the recovered value into the COMMAREA item, so the
          value exists only in the returned COMMAREA. The Db2-side counterpart DB2-POLICYNUMBER
          PIC 9(10), base/src/lgpolicy.cpy:44, is declaration-only and carries no runtime
          value. Trimmed text holding an unsigned digit string with leading zeros stripped;
          never null, the landed contract admitting only a successful record. Second element of
          the natural key (source_system_key, policy_number).
        config:
          meta:
            logical_entry: policy_number
            runtime_status: active
            commarea_item: CA-POLICY-NUM
            commarea_locator: base/src/lgcmarea.cpy:35
            db2_item: DB2-POLICYNUMBER
            db2_locator: base/src/lgpolicy.cpy:44
        data_tests:
          - not_null

      - name: policy_type
        data_type: varchar(1)
        description: >-
          Single-letter product discriminator. This is not a COMMAREA item: DB2-POLICYTYPE
          PIC X, base/src/lgpolicy.cpy:43, is assigned by the request-routing EVALUATE at
          base/src/lgapdb01.cbl:184-207, in which 01AEND yields E at base/src/lgapdb01.cbl:188,
          01AHOU yields H at base/src/lgapdb01.cbl:192, 01AMOT yields M at
          base/src/lgapdb01.cbl:196 and 01ACOM yields C at base/src/lgapdb01.cbl:200, and it is
          passed to the policy insert at base/src/lgapdb01.cbl:283.
          modernization/extraction/extract_commarea.py derives the letter from the trimmed
          CA-REQUEST-ID through that same routing before landing and derives no other value
          from it. The letter decides which premium columns of a row carry a value. Trimmed
          text of one character; never null, the landed contract admitting only a successful
          record.
        config:
          meta:
            logical_entry: policy_type
            runtime_status: derived
            commarea_item: null
            commarea_locator: null
            db2_item: DB2-POLICYTYPE
            db2_locator: base/src/lgpolicy.cpy:43
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["E", "H", "M", "C"]

      - name: customer_number
        data_type: varchar(10)
        description: >-
          Customer number supplied in the request. CA-CUSTOMER-NUM PIC 9(10),
          base/src/lgcmarea.cpy:12, moved to the integer host variable DB2-CUSTOMERNUM-INT at
          base/src/lgapdb01.cbl:176 and passed to the policy insert at
          base/src/lgapdb01.cbl:280. Trimmed text holding an unsigned digit string with leading
          zeros stripped; never null.
        config:
          meta:
            logical_entry: customer_number
            runtime_status: active
            commarea_item: CA-CUSTOMER-NUM
            commarea_locator: base/src/lgcmarea.cpy:12
            db2_item: null
            db2_locator: null
        data_tests:
          - not_null

      - name: request_id
        data_type: varchar(6)
        description: >-
          Request identifier the chain routes on. CA-REQUEST-ID PIC X(6),
          base/src/lgcmarea.cpy:10, evaluated at base/src/lgapdb01.cbl:184. The accepted values
          are the four request ids the routing EVALUATE at base/src/lgapdb01.cbl:184-207
          recognises: 01AEND, which resolves policy type E at base/src/lgapdb01.cbl:188, 01AHOU,
          which resolves H at :192, 01AMOT, which resolves M at :196, and 01ACOM, which resolves
          C at :200. Those four ids are the keys of the request_routing.map block of
          modernization/extraction/copybook_field_map.yml, from which
          modernization/extraction/extract_commarea.py derives policy_type, so every id that
          reaches a landed record is one of them. Its WHEN OTHER branch at
          base/src/lgapdb01.cbl:202-205 sets return code 99 and the extractor lands no record for
          an id the routing does not recognise. The two authored sample definitions under
          modernization/extraction/sample_input/, which that map records under
          supported_request_ids, cover 01AMOT and 01ACOM; a landed 01AEND or 01AHOU record passes
          this gate on the same terms. Trimmed text; never null, the landed contract admitting
          only a successful record.
        config:
          meta:
            logical_entry: request_id
            runtime_status: active
            commarea_item: CA-REQUEST-ID
            commarea_locator: base/src/lgcmarea.cpy:10
            db2_item: null
            db2_locator: null
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["01AEND", "01AHOU", "01AMOT", "01ACOM"]

      - name: return_code
        data_type: varchar(2)
        description: >-
          Return code read from the returned COMMAREA. CA-RETURN-CODE PIC 9(2),
          base/src/lgcmarea.cpy:11. Every write site of the chain moves a quoted two-character
          literal, so the value is carried as the two-character string 00 rather than as a
          number and its leading zero is preserved: base/src/lgapol01.cbl:105 and :114;
          base/src/lgapdb01.cbl:172, :204, :211, :239, :293, :296, :301, :390, :428, :474
          and :548; and base/src/lgapvs01.cbl:144. The six values the chain assigns are 00
          success, 70 policy insert returned SQLCODE -530, 80 VSAM write response was not
          normal, 90 SQL failure, 98 COMMAREA shorter than the required length, and 99
          unsupported request id; the harness captures under
          modernization/validation/artifacts/ hold the returned code of each executed sample.
          Only a successful execution is landed: modernization/extraction/extract_commarea.py
          refuses a record whose returned code is not 00 and
          modernization/landing/landing-schema.json admits 00 alone, so this column holds 00 in
          every row of this model, the accepted_values test below pins it to that one code, and
          the other five values reach no layer of the warehouse. The column
          is retained because canonical.issued_policy carries it, and the models of
          models/marts/canonical restate the filter to 00 on their own reads. Trimmed text of
          two characters; never null.
        config:
          meta:
            logical_entry: return_code
            runtime_status: active
            commarea_item: CA-RETURN-CODE
            commarea_locator: base/src/lgcmarea.cpy:11
            db2_item: null
            db2_locator: null
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["00"]

      - name: issue_date
        data_type: varchar(10)
        description: >-
          Policy issue date supplied in the request. CA-ISSUE-DATE PIC X(10),
          base/src/lgcmarea.cpy:38; Db2-side counterpart DB2-ISSUEDATE PIC X(10),
          base/src/lgpolicy.cpy:46; passed to the policy insert as a character host variable at
          base/src/lgapdb01.cbl:281. Trimmed text holding a calendar date written YYYY-MM-DD; a
          landed null and a window holding only spaces both reach this column as null.
        config:
          meta:
            logical_entry: issue_date
            runtime_status: active
            commarea_item: CA-ISSUE-DATE
            commarea_locator: base/src/lgcmarea.cpy:38
            db2_item: DB2-ISSUEDATE
            db2_locator: base/src/lgpolicy.cpy:46

      - name: expiry_date
        data_type: varchar(10)
        description: >-
          Policy expiry date supplied in the request. CA-EXPIRY-DATE PIC X(10),
          base/src/lgcmarea.cpy:39; Db2-side counterpart DB2-EXPIRYDATE PIC X(10),
          base/src/lgpolicy.cpy:47; passed to the policy insert as a character host variable at
          base/src/lgapdb01.cbl:282. Trimmed text holding a calendar date written YYYY-MM-DD; a
          landed null and a window holding only spaces both reach this column as null.
        config:
          meta:
            logical_entry: expiry_date
            runtime_status: active
            commarea_item: CA-EXPIRY-DATE
            commarea_locator: base/src/lgcmarea.cpy:39
            db2_item: DB2-EXPIRYDATE
            db2_locator: base/src/lgpolicy.cpy:47

      - name: last_changed
        data_type: varchar(26)
        description: >-
          Policy last-changed timestamp read back after the policy insert. CA-LASTCHANGED
          PIC X(26), base/src/lgcmarea.cpy:40; Db2-side counterpart DB2-LASTCHANGED PIC X(26),
          base/src/lgpolicy.cpy:48. The insert writes CURRENT TIMESTAMP at
          base/src/lgapdb01.cbl:284 and the SELECT keyed on the recovered policy number at
          base/src/lgapdb01.cbl:316-321 reads the assigned value back into the COMMAREA item,
          so the value exists only in the returned COMMAREA.
          modernization/extraction/extract_commarea.py normalises the returned 26-character
          timestamp to ISO-8601 with a T separator and microsecond precision, written
          YYYY-MM-DDTHH:MM:SS.ffffff in 26 characters, before landing. Trimmed text; never
          null, the landed contract admitting only a successful record.
        config:
          meta:
            logical_entry: last_changed
            runtime_status: active
            commarea_item: CA-LASTCHANGED
            commarea_locator: base/src/lgcmarea.cpy:40
            db2_item: DB2-LASTCHANGED
            db2_locator: base/src/lgpolicy.cpy:48
        data_tests:
          - not_null

      - name: broker_id
        data_type: varchar(10)
        description: >-
          Broker identifier supplied in the request. CA-BROKERID PIC 9(10),
          base/src/lgcmarea.cpy:41; Db2-side counterpart DB2-BROKERID PIC 9(10),
          base/src/lgpolicy.cpy:49; moved to the integer host variable DB2-BROKERID-INT at
          base/src/lgapdb01.cbl:264 and passed to the policy insert at
          base/src/lgapdb01.cbl:285. Trimmed text holding an unsigned digit string with leading
          zeros stripped; a landed null reaches this column as null.
        config:
          meta:
            logical_entry: broker_id
            runtime_status: active
            commarea_item: CA-BROKERID
            commarea_locator: base/src/lgcmarea.cpy:41
            db2_item: DB2-BROKERID
            db2_locator: base/src/lgpolicy.cpy:49

      - name: brokers_reference
        data_type: varchar(10)
        description: >-
          Broker's reference supplied in the request. CA-BROKERSREF PIC X(10),
          base/src/lgcmarea.cpy:42; Db2-side counterpart DB2-BROKERSREF PIC X(10),
          base/src/lgpolicy.cpy:50; passed to the policy insert as a character host variable at
          base/src/lgapdb01.cbl:286. A blank-padded fixed-width alphanumeric window, so the
          value holds at most the 10 characters the PICTURE declares; a window holding only
          spaces reaches this column as null rather than as an empty string.
        config:
          meta:
            logical_entry: brokers_reference
            runtime_status: active
            commarea_item: CA-BROKERSREF
            commarea_locator: base/src/lgcmarea.cpy:42
            db2_item: DB2-BROKERSREF
            db2_locator: base/src/lgpolicy.cpy:50

      - name: payment_amount
        data_type: varchar(6)
        description: >-
          Policy payment amount supplied in the request. CA-PAYMENT PIC 9(6),
          base/src/lgcmarea.cpy:43; Db2-side counterpart DB2-PAYMENT PIC 9(6),
          base/src/lgpolicy.cpy:51; moved by MOVE CA-PAYMENT TO DB2-PAYMENT-INT at
          base/src/lgapdb01.cbl:265 into the integer host variable PIC S9(9) COMP declared at
          base/src/lgapdb01.cbl:92, and passed to the policy insert at
          base/src/lgapdb01.cbl:287. The MOVE applies no arithmetic and the value is inserted
          unchanged. The declaration is an unsigned DISPLAY numeric without an implied decimal,
          so the value is a whole number carried as an unsigned digit string with leading zeros
          stripped. Carried for every policy type.
        config:
          meta:
            logical_entry: payment
            runtime_status: active
            commarea_item: CA-PAYMENT
            commarea_locator: base/src/lgcmarea.cpy:43
            db2_item: DB2-PAYMENT
            db2_locator: base/src/lgpolicy.cpy:51

      - name: motor_premium_amount
        data_type: varchar(6)
        description: >-
          Motor policy premium amount supplied in the request. CA-M-PREMIUM PIC 9(6),
          base/src/lgcmarea.cpy:73; Db2-side counterpart DB2-M-PREMIUM PIC 9(6),
          base/src/lgpolicy.cpy:80; moved by MOVE CA-M-PREMIUM TO DB2-M-PREMIUM-INT at
          base/src/lgapdb01.cbl:445 into the integer host variable PIC S9(9) COMP declared at
          base/src/lgapdb01.cbl:100, and passed to the motor insert at
          base/src/lgapdb01.cbl:469. The MOVE applies no arithmetic and the value is inserted
          unchanged. The declaration is an unsigned DISPLAY numeric without an implied decimal,
          so the value is a whole number carried as an unsigned digit string with leading zeros
          stripped. Carries a value for policy type M and is null for every other policy type.
        config:
          meta:
            logical_entry: motor_premium
            runtime_status: active
            commarea_item: CA-M-PREMIUM
            commarea_locator: base/src/lgcmarea.cpy:73
            db2_item: DB2-M-PREMIUM
            db2_locator: base/src/lgpolicy.cpy:80

      - name: fire_premium_amount
        data_type: varchar(8)
        description: >-
          Commercial fire premium amount supplied in the request. CA-B-FirePremium PIC 9(8),
          base/src/lgcmarea.cpy:85; Db2-side counterpart DB2-B-FirePremium PIC 9(8),
          base/src/lgpolicy.cpy:91; moved by MOVE CA-B-FirePremium TO DB2-B-FirePremium-Int at
          base/src/lgapdb01.cbl:489 into the integer host variable PIC S9(9) COMP declared at
          base/src/lgapdb01.cbl:103, and passed to the commercial insert at
          base/src/lgapdb01.cbl:535. The MOVE applies no arithmetic and the value is inserted
          unchanged. The declaration is an unsigned DISPLAY numeric without an implied decimal,
          so the value is a whole number carried as an unsigned digit string with leading zeros
          stripped. Carries a value for policy type C and is null for every other policy type.
        config:
          meta:
            logical_entry: fire_premium
            runtime_status: active
            commarea_item: CA-B-FirePremium
            commarea_locator: base/src/lgcmarea.cpy:85
            db2_item: DB2-B-FirePremium
            db2_locator: base/src/lgpolicy.cpy:91

      - name: crime_premium_amount
        data_type: varchar(8)
        description: >-
          Commercial crime premium amount supplied in the request. CA-B-CrimePremium PIC 9(8),
          base/src/lgcmarea.cpy:87; Db2-side counterpart DB2-B-CrimePremium PIC 9(8),
          base/src/lgpolicy.cpy:93; moved by MOVE CA-B-CrimePremium TO DB2-B-CrimePremium-Int at
          base/src/lgapdb01.cbl:491 into the integer host variable PIC S9(9) COMP declared at
          base/src/lgapdb01.cbl:105, and passed to the commercial insert at
          base/src/lgapdb01.cbl:537. The MOVE applies no arithmetic and the value is inserted
          unchanged. The declaration is an unsigned DISPLAY numeric without an implied decimal,
          so the value is a whole number carried as an unsigned digit string with leading zeros
          stripped. Carries a value for policy type C and is null for every other policy type.
        config:
          meta:
            logical_entry: crime_premium
            runtime_status: active
            commarea_item: CA-B-CrimePremium
            commarea_locator: base/src/lgcmarea.cpy:87
            db2_item: DB2-B-CrimePremium
            db2_locator: base/src/lgpolicy.cpy:93

      - name: flood_premium_amount
        data_type: varchar(8)
        description: >-
          Commercial flood premium amount supplied in the request. CA-B-FloodPremium PIC 9(8),
          base/src/lgcmarea.cpy:89; Db2-side counterpart DB2-B-FloodPremium PIC 9(8),
          base/src/lgpolicy.cpy:95; moved by MOVE CA-B-FloodPremium TO DB2-B-FloodPremium-Int at
          base/src/lgapdb01.cbl:493 into the integer host variable PIC S9(9) COMP declared at
          base/src/lgapdb01.cbl:107, and passed to the commercial insert at
          base/src/lgapdb01.cbl:539. The MOVE applies no arithmetic and the value is inserted
          unchanged. The declaration is an unsigned DISPLAY numeric without an implied decimal,
          so the value is a whole number carried as an unsigned digit string with leading zeros
          stripped. Carries a value for policy type C and is null for every other policy type.
        config:
          meta:
            logical_entry: flood_premium
            runtime_status: active
            commarea_item: CA-B-FloodPremium
            commarea_locator: base/src/lgcmarea.cpy:89
            db2_item: DB2-B-FloodPremium
            db2_locator: base/src/lgpolicy.cpy:95

      - name: weather_premium_amount
        data_type: varchar(8)
        description: >-
          Commercial weather premium amount supplied in the request. CA-B-WeatherPremium
          PIC 9(8), base/src/lgcmarea.cpy:91; Db2-side counterpart DB2-B-WeatherPremium
          PIC 9(8), base/src/lgpolicy.cpy:97; moved by
          MOVE CA-B-WeatherPremium TO DB2-B-WeatherPremium-Int at base/src/lgapdb01.cbl:495 into
          the integer host variable PIC S9(9) COMP declared at base/src/lgapdb01.cbl:109, and
          passed to the commercial insert at base/src/lgapdb01.cbl:541. The MOVE applies no
          arithmetic and the value is inserted unchanged. The declaration is an unsigned DISPLAY
          numeric without an implied decimal, so the value is a whole number carried as an
          unsigned digit string with leading zeros stripped. Carries a value for policy type C
          and is null for every other policy type.
        config:
          meta:
            logical_entry: weather_premium
            runtime_status: active
            commarea_item: CA-B-WeatherPremium
            commarea_locator: base/src/lgcmarea.cpy:91
            db2_item: DB2-B-WeatherPremium
            db2_locator: base/src/lgpolicy.cpy:97
