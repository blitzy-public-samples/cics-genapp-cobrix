          0.01 that modernization/extraction/copybook_field_map.yml records under
          comparison.amount_tolerance_abs, it is present exactly where that upstream value
          is present, it is not negative, and it does not exceed 999999, the largest value
          the PIC 9(6) declaration holds.
        config:
