# Machine-readable field map for the GenApp Policy-Issue COMMAREA.
#
# WHAT THIS FILE IS
#   The single metadata spine of the canonical-warehouse bridge. It records, for every in-scope
#   COMMAREA declaration, Db2-side counterpart and program intermediate: the logical field entry,
#   the physical declaration, the byte offset where one applies, the runtime status, the target
#   column and the transformation applied on the way to the warehouse.
#
# HOW IT IS USED
#   Loaded with a yaml.SafeLoader that rejects a repeated mapping key, a key it cannot compare,
#   an alias and the merge key. modernization/extraction/build_sample_commarea.py reads the
#   record, layout, field, routing and sample contract sections, and
#   modernization/harness/run_harness.sh passes it that path on every run.
#   modernization/extraction/extract_commarea.py reads the record, layout, field, routing,
#   excluded, landing, comparison and product premium nullability sections, plus the
#   source_system_key section, to decode one post-chain record into the landing record.
#   The two tools listed under `current_consumers` read this file at run time. The artifacts
#   listed under `derived_artifacts` stand in the tree and carry the layout, typing and lineage
#   facts of this file in their authored text; each was authored from it and none of them reads
#   it. The artifacts under `planned_consumers` will carry the same facts once they are
#   processed; none of them is present at this milestone. Byte layout is expressed only as
#   `offset`, `length` and `pic` values.
#
# EVIDENCE BOUNDARY
#   Every locator in this file resolves to one of the five authorised source artifacts:
#   base/src/lgapol01.cbl, base/src/lgapdb01.cbl, base/src/lgapvs01.cbl, base/src/lgcmarea.cpy and
#   base/src/lgpolicy.cpy. Locators are written as `path:line` or `path:first-last`. The five named
#   source artifacts are read-only and are never modified by this work. The sole warehouse-assigned
#   column under `source_system_key` records `user requirement` in place of a locator.
#
# CONTENT BOUNDARY
#   This file states what each field is and how it is treated. Decision rationale belongs to
#   modernization/docs/decision-log.md and is deliberately absent here. Every `rationale`
#   value below is a pointer to that document, never rationale itself.

map_version: 1
rationale: >-
  see modernization/docs/decision-log.md

# The interface record shared by every program in the named chain.
record:
  name: DFHCOMMAREA
  copybook: base/src/lgcmarea.cpy
  copybook_start_level: "03"
  copybook_line_range: "10-103"
  length: 32500
  numeric_representation: >-
    The six amount items are unsigned DISPLAY numerics declared without an implied decimal
    (PIC 9(6) for payment and motor premium, PIC 9(8) for the four commercial premiums), so each
    byte holds one digit character and every stored value is a whole number.
  linkage_bindings:
    - program: LGAPOL01
      locator: base/src/lgapol01.cbl:70-71
      declaration: 01 DFHCOMMAREA. followed by Copy LGCMAREA.
    - program: LGAPDB01
      locator: base/src/lgapdb01.cbl:134-137
      declaration: 01 DFHCOMMAREA. followed by EXEC SQL INCLUDE LGCMAREA END-EXEC.
    - program: LGAPVS01
      locator: base/src/lgapvs01.cbl:86-87
      declaration: 01 DFHCOMMAREA. followed by Copy LGCMAREA.
  link_length_observed: 32500
  links:
    - call_order: 1
      from_program: LGAPOL01
      to_program: LGAPDB01
      commarea: DFHCOMMAREA
      length: 32500
      locator: base/src/lgapol01.cbl:121-124
    - call_order: 2
      from_program: LGAPDB01
      to_program: LGAPVS01
      commarea: DFHCOMMAREA
      length: 32500
      locator: base/src/lgapdb01.cbl:243-246

# Premium and payment values are carried unchanged; no rating calculation exists in the chain.
formula: none

formula_evidence:
  premium_derivation_present: false
  amount_paths: >-
    Every amount reaches its Db2 host variable through a MOVE statement and is inserted without
    modification.
  statement_census:
    programs_examined:
      - base/src/lgapol01.cbl
      - base/src/lgapdb01.cbl
      - base/src/lgapvs01.cbl
    compute_statements: 0
    multiply_statements: 0
    divide_statements: 0
    add_statements: 6
    subtract_statements: 1
  add_statement_locators:
    - base/src/lgapol01.cbl:109
    - base/src/lgapdb01.cbl:182
    - base/src/lgapdb01.cbl:187
    - base/src/lgapdb01.cbl:191
    - base/src/lgapdb01.cbl:195
    - base/src/lgapdb01.cbl:199
  subtract_statement_locators:
    - base/src/lgapdb01.cbl:339
  arithmetic_operands: length constants only
  amount_move_locators:
    - base/src/lgapdb01.cbl:265
    - base/src/lgapdb01.cbl:445
    - base/src/lgapdb01.cbl:489
    - base/src/lgapdb01.cbl:491
    - base/src/lgapdb01.cbl:493
    - base/src/lgapdb01.cbl:495
  rationale: >-
    see modernization/docs/decision-log.md

