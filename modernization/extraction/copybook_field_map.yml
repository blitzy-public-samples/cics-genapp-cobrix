# Contract for the landed object and the raw relation loaded from it. The artifacts that carry it
# all stand in the tree at this milestone: modernization/landing/landing-schema.json for the
# record shape, modernization/landing/land_to_s3.py for the object and its key prefix,
# modernization/warehouse/ddl/02_raw_genapp_policy_issue.sql for the raw relation, and
# modernization/landing/load_redshift.sql and modernization/landing/load_local.py for the load
# into it, so this section states a contract in force rather than one awaiting its artifacts.
# `field_order` is the column order every one of them uses. This section records no
# execution against any target. modernization/landing/partition-layout.md, which will document
# the prefix in prose, is a planned deliverable and is not present at this milestone.
landing:
  entity: policy_issue
  raw_relation: raw.genapp_policy_issue
  all_columns_varchar: true
  value_encoding: json_string_or_null
  record_format: one JSON object per object file, serialized as a single line terminated by LF
  additional_keys_permitted: false
  json_schema: modernization/landing/landing-schema.json
  s3_prefix_template: >-
    landing/source_system_key=<source_system_key>/entity=policy_issue/extract_date=YYYY-MM-DD/part-0000.json
  partitioning_scope: S3 key prefix only
  field_order:
    - source_system_key
    - policy_number
    - policy_type
    - customer_number
    - request_id
    - return_code
    - issue_date
    - expiry_date
    - last_changed
    - broker_id
    - brokers_reference
    - payment_amount
    - motor_premium_amount
    - fire_premium_amount
    - crime_premium_amount
    - flood_premium_amount
    - weather_premium_amount

# Which amount fields carry a value for each policy type. Inapplicable product premiums are null.
# `enforcement` names the dbt singular test that asserts this pattern on
# canonical.preissued_rating, and that test stands in the tree at this milestone.
# modernization/extraction/extract_commarea.py applies the pattern to the landed record, the
# models of modernization/dbt/genapp_rqi/models/ carry it through, and
# modernization/extraction/build_sample_commarea.py reads that member and checks it against the
# test its own self-test carries.
product_premium_nullability:
  always_populated:
    - payment_amount
  inapplicable_value: null
  zero_substitution_permitted: false
  decided_by: policy_type
  # The overlays redefine the same bytes from offset 101, so an item of the overlay a
  # request does not select can read as non-blank content placed by the selected overlay.
  # A blank or zero window is not the test for an inapplicable premium; the policy type is.
  inactive_overlay_bytes_may_be_non_blank: true
  blank_or_zero_content_is_not_the_null_test: true
  # What the sample builder's own cases establish. These cases read record bytes and
  # request routing; they read no raw, staging, intermediate or canonical column.
  record_bytes_demonstrated_by:
    tool: modernization/extraction/build_sample_commarea.py
    invocation: --self-test
    cases:
      - case: commercial_inactive_overlay_filled
        request_id: 01ACOM
        establishes:
          - the bytes CA-M-PREMIUM declares hold commercial address content, not blanks
          - request id 01ACOM resolves policy type C
          - a CA-M-PREMIUM key is rejected for request id 01ACOM
      - case: motor_inactive_overlay_spaces
        request_id: 01AMOT
        establishes:
          - the four commercial premium windows fall inside CA-M-FILLER and hold its spaces
          - request id 01AMOT resolves policy type M
          - a CA-B-FirePremium key is rejected for request id 01AMOT
        non_blank_inactive_bytes_reachable: false
        non_blank_inactive_bytes_blocked_by: CA-M-FILLER is a protected fill item
    does_not_establish:
      - any raw, staging, intermediate or canonical column value
      - motor_premium_amount IS NULL while the four commercial premiums carry values
      - the four commercial premiums IS NULL while motor_premium_amount carries a value
  # Where the column-level assertion is carried. The two cases below are the transformed
  # assertion this contract requires; the builder cases above do not carry it.
  transformed_assertion_carried_by:
    test: modernization/dbt/genapp_rqi/tests/assert_product_premium_nullability.sql
    required_cases:
      - policy_type: "M"
        raw_inactive_overlay_bytes: non_blank
        populated:
          - motor_premium_amount
        null_fields:
          - fire_premium_amount
          - crime_premium_amount
          - flood_premium_amount
          - weather_premium_amount
      - policy_type: "C"
        raw_inactive_overlay_bytes: non_blank
        populated:
          - fire_premium_amount
          - crime_premium_amount
          - flood_premium_amount
          - weather_premium_amount
        null_fields:
          - motor_premium_amount
  by_policy_type:
    "M":
      populated:
        - motor_premium_amount
      null_fields:
        - fire_premium_amount
        - crime_premium_amount
        - flood_premium_amount
        - weather_premium_amount
    "C":
      populated:
        - fire_premium_amount
        - crime_premium_amount
        - flood_premium_amount
        - weather_premium_amount
      null_fields:
        - motor_premium_amount
    "E":
      populated: []
      null_fields:
        - motor_premium_amount
        - fire_premium_amount
        - crime_premium_amount
        - flood_premium_amount
        - weather_premium_amount
    "H":
      populated: []
      null_fields:
        - motor_premium_amount
        - fire_premium_amount
        - crime_premium_amount
        - flood_premium_amount
        - weather_premium_amount
  enforcement: modernization/dbt/genapp_rqi/tests/assert_product_premium_nullability.sql

# The two canonical relations, and the only two relations of the canonical schema.
