# The seventeen logical field entries. `runtime_status` is one of active, derived or
# declaration_only. `populated_by` is one of request, chain, derivation or null. The
# warehouse-assigned entry is held separately under the `source_system_key` key below.
fields:

  - logical_entry: payment
    concept: Policy payment amount
    group: premium_payment
    runtime_status: active
    populated_by: request
    applicable_policy_types: ["E", "H", "M", "C"]
    commarea:
      item: CA-PAYMENT
      copybook: base/src/lgcmarea.cpy
      line: 43
      pic: "9(6)"
      offset: 95
      length: 6
      overlay: policy_common
    db2_declaration:
      item: DB2-PAYMENT
      copybook: base/src/lgpolicy.cpy
      line: 51
      pic: "9(6)"
    program_intermediates:
      - item: DB2-PAYMENT-INT
        file: base/src/lgapdb01.cbl
        line: 92
        pic: "S9(9) COMP"
        set_at: base/src/lgapdb01.cbl:265
        passed_to_insert_at: base/src/lgapdb01.cbl:287
    targets:
      - relation: canonical.preissued_rating
        column: payment_amount
        type: DECIMAL(8,2)
        nullable: true
    landing_field: payment_amount
    transformation: >-
      Passthrough. The MOVE into the integer host variable applies no arithmetic and the value is
      inserted unchanged. Leading zeros are stripped for landing and the warehouse casts the
      landed string to a scale-2 decimal.
    evidence:
      - base/src/lgcmarea.cpy:43
      - base/src/lgpolicy.cpy:51
      - base/src/lgapdb01.cbl:92
      - base/src/lgapdb01.cbl:265
      - base/src/lgapdb01.cbl:287

  - logical_entry: motor_premium
    concept: Motor policy premium amount
    group: premium_payment
    runtime_status: active
    populated_by: request
    applicable_policy_types: ["M"]
    commarea:
      item: CA-M-PREMIUM
      copybook: base/src/lgcmarea.cpy
      line: 73
      pic: "9(6)"
      offset: 166
      length: 6
      overlay: motor_overlay
    db2_declaration:
      item: DB2-M-PREMIUM
      copybook: base/src/lgpolicy.cpy
