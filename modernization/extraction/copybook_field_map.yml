# Request-id routing observed in the first EVALUATE. Each branch assigns the policy-type letter
# and adds the product length constant to the required-length accumulator.
request_routing:
  evaluated_item: CA-REQUEST-ID
  evaluate_range: base/src/lgapdb01.cbl:184-207
  assigned_item: DB2-POLICYTYPE
  policy_type_passed_to_insert_at: base/src/lgapdb01.cbl:283
  map:
    "01AEND":
      policy_type: "E"
      set_at: base/src/lgapdb01.cbl:188
      length_constant_added: WS-FULL-ENDOW-LEN
      length_add_at: base/src/lgapdb01.cbl:187
      overlay: null
    "01AHOU":
      policy_type: "H"
      set_at: base/src/lgapdb01.cbl:192
      length_constant_added: WS-FULL-HOUSE-LEN
      length_add_at: base/src/lgapdb01.cbl:191
      overlay: null
    "01AMOT":
      policy_type: "M"
      set_at: base/src/lgapdb01.cbl:196
      length_constant_added: WS-FULL-MOTOR-LEN
      length_add_at: base/src/lgapdb01.cbl:195
      overlay: motor_overlay
    "01ACOM":
      policy_type: "C"
      set_at: base/src/lgapdb01.cbl:200
      length_constant_added: WS-FULL-COMM-LEN
      length_add_at: base/src/lgapdb01.cbl:199
      overlay: commercial_overlay
  unrecognised_request:
    return_code: "99"
    set_at: base/src/lgapdb01.cbl:204
    returns_at: base/src/lgapdb01.cbl:205
  product_insert_dispatch:
    evaluate_range: base/src/lgapdb01.cbl:223-241
    unrecognised_request_return_code: "99"
    unrecognised_request_set_at: base/src/lgapdb01.cbl:239

# Sample cases this work generates. modernization/extraction/build_sample_commarea.py generates
# both records from the definitions under modernization/extraction/sample_input/ and
# modernization/harness/run_harness.sh executes them through the translated chain. These two
# request ids are the only ones an authored sample definition describes and the only ones the
# builder emits a record for. A record the harness runner writes for itself from one of these two
# records is recorded under `derived_samples`.
supported_request_ids: ["01AMOT", "01ACOM"]

supported_samples:
  - request_id: "01AMOT"
    policy_type: "M"
    overlay: motor_overlay
    sample_definition: modernization/extraction/sample_input/commarea_01amot.json
    amount_fields_exercised:
      - payment_amount
      - motor_premium_amount
  - request_id: "01ACOM"
    policy_type: "C"
    overlay: commercial_overlay
    sample_definition: modernization/extraction/sample_input/commarea_01acom.json
    amount_fields_exercised:
      - payment_amount
      - fire_premium_amount
