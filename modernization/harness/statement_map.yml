# the first captured event rather than on a pair. The `witness` block of each
# entry names the hcapture.cpy ordinal items that carry the observed order and
# the assertions evaluated over their values. In an assertion, `left_item` and
# `right_item` name ordinal items, `right_literal` carries a value, and
# `operator` is 'greater_than', 'less_than' or 'equal_to'. An assertion that
# does not hold reports the constraint as violated. One entry carries a set of
# alternative predecessors: `predecessor_ordinal_items_any` names them and an
# assertion whose `any_of` holds a list is satisfied when any member of that
# list is satisfied.
#
# Every entry below is enforced at run time by the capturing stub named in its
# `enforced_by` field, which reads its prerequisite ordinal after stamping its
# own and reports a prerequisite still at zero in HC-ORDER-VIOLATION and
# HC-ORDER-VIOLATION-STMT. The one entry carrying `predecessor: 'none'` has no
# prerequisite ordinal to read: its stub reports its own ordinal in those same
# two items when that ordinal is not the first value the shared sequence issues.
# modernization/harness/driver.cbl evaluates the same
# order independently by walking the ordinals it reads out of the capture
# state, so a constraint is observed twice by construction.
#
# modernization/harness/translate.py validates both order sections before it
# generates anything and fails the translation on any disagreement: the
# required members and their types, unique constraint ids, a `predecessor` and
# `successor` naming a declared dml id or the sentinel documented above, a
# `reason_kind` from the closed set with the `host` of a data dependency
# declared by the successor's `using` list, an `enforced_by` naming the
# existing stub file that captures that successor and whose code names every
# ordinal item of the constraint and both order-guard items, witness ordinal
# items equal to the ones capture_ordinals gives the two sides, assertions
# drawn from the operators above over items the witness carries and literals
# inside the declared ordinal picture, the ordering and stamped assertions the
# shape of each constraint requires, and one constraint per distinct ordinal
# item reconciled with checks.order_constraint_count.
# Every entry below is also reconciled at build time by
# modernization/harness/translate.py, which fails the run when an ordinal item
# named here is not declared by modernization/harness/copybooks/hcapture.cpy,
# when the `enforced_by` member does not stamp the successor ordinal or does
# not read exactly the declared prerequisite ordinals in its order guard, when
# the prerequisite table of that copybook disagrees with an entry, when a
# declared predecessor or successor id does not resolve through
# `capture_ordinals` to the ordinal item the entry names, or when the
# assertions of an entry do not compare the pair the entry declares.
#
# Each `predecessor` names the immediate predecessor of its successor: the
# statement that stands directly ahead of it on the one path the source takes
# to it. A constraint on an earlier statement is carried transitively by the
# chain of entries, so insert_policy standing ahead of select_lastchanged is
# asserted by policy_before_identity and identity_before_lastchanged rather
# than repeated by each product entry.
execution_order:
  - id: 'policy_first_captured'
    predecessor: 'none'
    successor: 'insert_policy'
    reason_kind: 'control_flow'
    enforced_by: 'modernization/harness/stubs/sql_insert_policy.cbl'
    note: >-
      PERFORM INSERT-POLICY at base/src/lgapdb01.cbl:219 is the first statement
      the Db2 program reaches after the length and routing checks, and the
      product routing at base/src/lgapdb01.cbl:223-241 and the link at
      base/src/lgapdb01.cbl:243-246 both follow it, so the POLICY insert is the
      first captured event of any case that reaches a captured statement at
      all.
    witness:
      copybook: 'modernization/harness/copybooks/hcapture.cpy'
      predecessor_ordinal_item: 'none'
      successor_ordinal_item: 'HC-POL-SEQ'
      assertions:
        # Nothing was captured ahead of the POLICY insert, so its ordinal is
        # the first value the shared sequence item issues.
        - left_item: 'HC-POL-SEQ'
          operator: 'equal_to'
          right_literal: 1

  - id: 'policy_before_identity'
    predecessor: 'insert_policy'
    successor: 'set_identity'
    reason_kind: 'data_dependency'
    host: 'DB2-POLICYNUM-INT'
    enforced_by: 'modernization/harness/stubs/sql_set_identity.cbl'
    note: >-
      IDENTITY_VAL_LOCAL() at base/src/lgapdb01.cbl:307-311 returns the
      identity the INSERT INTO POLICY block at base/src/lgapdb01.cbl:268-288
      assigned, so the read has no value to recover until that insert has run.
    witness:
      copybook: 'modernization/harness/copybooks/hcapture.cpy'
      predecessor_ordinal_item: 'HC-POL-SEQ'
      successor_ordinal_item: 'HC-IDENT-SEQ'
      assertions:
        - left_item: 'HC-POL-SEQ'
          operator: 'greater_than'
          right_literal: 0
        - left_item: 'HC-IDENT-SEQ'
          operator: 'greater_than'
          right_literal: 0
        - left_item: 'HC-POL-SEQ'
          operator: 'less_than'
          right_item: 'HC-IDENT-SEQ'

  - id: 'identity_before_lastchanged'
    predecessor: 'set_identity'
    successor: 'select_lastchanged'
    reason_kind: 'data_dependency'
    host: 'DB2-POLICYNUM-INT'
    enforced_by: 'modernization/harness/stubs/sql_select_lastchanged.cbl'
    note: >-
      The SELECT LASTCHANGED read-back at base/src/lgapdb01.cbl:316-321 selects
      the row whose POLICYNUMBER equals the host the identity read at
      base/src/lgapdb01.cbl:307-311 set, so that read is its predicate source.
    witness:
      copybook: 'modernization/harness/copybooks/hcapture.cpy'
      predecessor_ordinal_item: 'HC-IDENT-SEQ'
      successor_ordinal_item: 'HC-LCHG-SEQ'
      assertions:
        - left_item: 'HC-IDENT-SEQ'
          operator: 'greater_than'
          right_literal: 0
        - left_item: 'HC-LCHG-SEQ'
          operator: 'greater_than'
          right_literal: 0
        - left_item: 'HC-IDENT-SEQ'
          operator: 'less_than'
          right_item: 'HC-LCHG-SEQ'

  - id: 'lastchanged_before_motor'
    predecessor: 'select_lastchanged'
    successor: 'insert_motor'
    reason_kind: 'control_flow'
    enforced_by: 'modernization/harness/stubs/sql_insert_motor.cbl'
    note: >-
      The SELECT LASTCHANGED read-back at base/src/lgapdb01.cbl:316-321 is the
      last EXEC SQL block of paragraph INSERT-POLICY, performed at
      base/src/lgapdb01.cbl:219, and the product routing that reaches the MOTOR
      insert at base/src/lgapdb01.cbl:449-471 follows that PERFORM at
      base/src/lgapdb01.cbl:223-241, so the read-back is the statement standing
      directly ahead of this insert. HC-LCHG-SEQ therefore also carries the
      identity recovery at base/src/lgapdb01.cbl:307-311, which supplies the
      POLICYNUMBER of this insert, and the POLICY insert ahead of it.
    witness:
      copybook: 'modernization/harness/copybooks/hcapture.cpy'
      predecessor_ordinal_item: 'HC-LCHG-SEQ'
      successor_ordinal_item: 'HC-MOT-SEQ'
      assertions:
        - left_item: 'HC-LCHG-SEQ'
          operator: 'greater_than'
          right_literal: 0
        - left_item: 'HC-MOT-SEQ'
          operator: 'greater_than'
          right_literal: 0
        - left_item: 'HC-LCHG-SEQ'
          operator: 'less_than'
          right_item: 'HC-MOT-SEQ'

  - id: 'lastchanged_before_house'
    predecessor: 'select_lastchanged'
    successor: 'insert_house'
    reason_kind: 'control_flow'
    enforced_by: 'modernization/harness/stubs/sql_insert_house.cbl'
    note: >-
      The SELECT LASTCHANGED read-back at base/src/lgapdb01.cbl:316-321 is the
      last EXEC SQL block of paragraph INSERT-POLICY, performed at
      base/src/lgapdb01.cbl:219, and the product routing that reaches the HOUSE
      insert at base/src/lgapdb01.cbl:409-425 follows that PERFORM at
      base/src/lgapdb01.cbl:223-241, so the read-back is the statement standing
      directly ahead of this insert. HC-LCHG-SEQ therefore also carries the
      identity recovery at base/src/lgapdb01.cbl:307-311, which supplies the
      POLICYNUMBER of this insert, and the POLICY insert ahead of it.
    witness:
      copybook: 'modernization/harness/copybooks/hcapture.cpy'
      predecessor_ordinal_item: 'HC-LCHG-SEQ'
      successor_ordinal_item: 'HC-HOU-SEQ'
      assertions:
        - left_item: 'HC-LCHG-SEQ'
          operator: 'greater_than'
          right_literal: 0
        - left_item: 'HC-HOU-SEQ'
          operator: 'greater_than'
          right_literal: 0
        - left_item: 'HC-LCHG-SEQ'
          operator: 'less_than'
          right_item: 'HC-HOU-SEQ'

  - id: 'lastchanged_before_endowment'
    predecessor: 'select_lastchanged'
    successor: 'insert_endowment_varchar'
    reason_kind: 'control_flow'
    enforced_by: 'modernization/harness/stubs/sql_insert_endowment.cbl'
    note: >-
      The SELECT LASTCHANGED read-back at base/src/lgapdb01.cbl:316-321 is the
      last EXEC SQL block of paragraph INSERT-POLICY, performed at
      base/src/lgapdb01.cbl:219, and the product routing that reaches both
      ENDOWMENT inserts at base/src/lgapdb01.cbl:346-386 follows that PERFORM
      at base/src/lgapdb01.cbl:223-241, so the read-back is the statement
      standing directly ahead of whichever arm runs. HC-LCHG-SEQ therefore also
      carries the identity recovery at base/src/lgapdb01.cbl:307-311, which
      supplies the POLICYNUMBER of both inserts, and the POLICY insert ahead of
      it. This entry covers insert_endowment_novarchar on the same terms: both
      ids resolve to the ENDOWMENT capture group, to HC-END-SEQ and to the one
      recording stub.
    witness:
      copybook: 'modernization/harness/copybooks/hcapture.cpy'
      predecessor_ordinal_item: 'HC-LCHG-SEQ'
      successor_ordinal_item: 'HC-END-SEQ'
      assertions:
        - left_item: 'HC-LCHG-SEQ'
          operator: 'greater_than'
          right_literal: 0
        - left_item: 'HC-END-SEQ'
          operator: 'greater_than'
          right_literal: 0
        - left_item: 'HC-LCHG-SEQ'
          operator: 'less_than'
          right_item: 'HC-END-SEQ'

  - id: 'policy_and_product_before_vsam_write'
    predecessor: 'insert_policy'
    successor: 'cics_write'
    reason_kind: 'control_flow'
    enforced_by: 'modernization/harness/stubs/cics_write.cbl'
    note: >-
      The link to LGAPVS01 at base/src/lgapdb01.cbl:243-246 is the only path
      that reaches the KSDSPOLY write at base/src/lgapvs01.cbl:135-141, and it
      follows both PERFORM INSERT-POLICY at base/src/lgapdb01.cbl:219 and the
      product insert the routing at base/src/lgapdb01.cbl:223-241 selects, so a
      captured write stands after a captured policy insert and after one
      captured product insert.
    witness:
      copybook: 'modernization/harness/copybooks/hcapture.cpy'
      predecessor_ordinal_item: 'HC-POL-SEQ'
      predecessor_ordinal_items_any:
        - 'HC-MOT-SEQ'
        - 'HC-COM-SEQ'
        - 'HC-END-SEQ'
        - 'HC-HOU-SEQ'
      successor_ordinal_item: 'HC-VSAM-SEQ'
      assertions:
        - left_item: 'HC-POL-SEQ'
          operator: 'greater_than'
          right_literal: 0
        - left_item: 'HC-VSAM-SEQ'
          operator: 'greater_than'
          right_literal: 0
        - left_item: 'HC-POL-SEQ'
          operator: 'less_than'
          right_item: 'HC-VSAM-SEQ'
        # One product insert of the four routes was captured before the write.
        - any_of:
            - left_item: 'HC-MOT-SEQ'
              operator: 'greater_than'
              right_literal: 0
            - left_item: 'HC-COM-SEQ'
              operator: 'greater_than'
              right_literal: 0
            - left_item: 'HC-END-SEQ'
              operator: 'greater_than'
              right_literal: 0
            - left_item: 'HC-HOU-SEQ'
              operator: 'greater_than'
              right_literal: 0

  - id: 'lastchanged_before_commercial'
    predecessor: 'select_lastchanged'
    successor: 'insert_commercial'
    reason_kind: 'data_dependency'
    host: 'CA-LASTCHANGED'
    enforced_by: 'modernization/harness/stubs/sql_insert_commercial.cbl'
    note: >-
      CA-LASTCHANGED is supplied to the COMMERCIAL column RequestDate at
      base/src/lgapdb01.cbl:525 and is populated only by the SELECT LASTCHANGED
      read-back at base/src/lgapdb01.cbl:316-321, the last EXEC SQL block of
      paragraph INSERT-POLICY, which reads the row written by the INSERT INTO
      POLICY block at base/src/lgapdb01.cbl:268-288. The product routing that
      reaches the COMMERCIAL insert at base/src/lgapdb01.cbl:499-545 follows
      that PERFORM at base/src/lgapdb01.cbl:223-241.
    witness:
      copybook: 'modernization/harness/copybooks/hcapture.cpy'
      predecessor_ordinal_item: 'HC-LCHG-SEQ'
      successor_ordinal_item: 'HC-COM-SEQ'
      assertions:
        # The predecessor was captured.
        - left_item: 'HC-LCHG-SEQ'
          operator: 'greater_than'
          right_literal: 0
        # The successor was captured.
        - left_item: 'HC-COM-SEQ'
          operator: 'greater_than'
          right_literal: 0
        # The predecessor was captured earlier than the successor.
        - left_item: 'HC-LCHG-SEQ'
          operator: 'less_than'
          right_item: 'HC-COM-SEQ'

# Ordering witness items declared by
# modernization/harness/copybooks/hcapture.cpy. A capture stub adds 1 to
# `sequence_item` and moves the new value into the ordinal item of its own
# capture group as it records the event. A lower ordinal marks the earlier
# event; `unstamped_value` marks a block that was never captured.
# `by_dml_id` carries one entry per dml id above, spelled as that entry
# spells it; both ENDOWMENT ids resolve to the single ENDOWMENT capture group
# and name the same ordinal item.
#
# This block is the one resolution from an event id to an ordinal item:
# modernization/harness/translate.py resolves the `predecessor` and
# `successor` of every execution_order entry through `by_dml_id` and
# `vsam_write_event_id`, and fails the run when the ordinal an entry declares
# is not the one that resolution returns. Every item named here, the sequence
# item and the items under `non_statement_ordinal_items` together account for
# every ordinal item the copybook declares; a declared item accounted for
# nowhere here also fails the run.
capture_ordinals:
  copybook: 'modernization/harness/copybooks/hcapture.cpy'
  sequence_item: 'HC-EVENT-SEQ'
  ordinal_pic: '9(4)'
  unstamped_value: 0
  by_dml_id:
    insert_policy: 'HC-POL-SEQ'
    set_identity: 'HC-IDENT-SEQ'
    select_lastchanged: 'HC-LCHG-SEQ'
    insert_endowment_varchar: 'HC-END-SEQ'
    insert_endowment_novarchar: 'HC-END-SEQ'
    insert_house: 'HC-HOU-SEQ'
    insert_motor: 'HC-MOT-SEQ'
    insert_commercial: 'HC-COM-SEQ'
  # The KSDSPOLY write at base/src/lgapvs01.cbl:135-141 is not an EXEC SQL
  # block of this map. Its ordinal is stamped from the same sequence item and
  # is named here beside the SQL ordinals, under the event id the
  # execution_order entry of the write uses as its successor.
  vsam_write_event_id: 'cics_write'
  vsam_write_ordinal_item: 'HC-VSAM-SEQ'
  # The seven distinct values of by_dml_id plus vsam_write_ordinal_item.
  distinct_ordinal_items: 8
  # Ordinal items stamped from the same sequence item that carry no statement
  # of this map and stand in no execution_order entry. HC-ABEND-SEQ records
  # where an abend site of the three translated programs stood in the capture
  # order of its case.
  non_statement_ordinal_items:
    - 'HC-ABEND-SEQ'

# Counts asserted by modernization/harness/translate.py after loading
# this file. using_counts is keyed by call target: the call_program value with
# the SQL- prefix removed, lower-cased, hyphens replaced by underscores. The
# two ENDOWMENT blocks share the insert_endowment key; both name the same stub
# and the same 9-item signature. order_constraint_count is the number of
# execution_order entries, which is also the number of distinct ordinal items
# capture_ordinals names: one constraint stands on each.
checks:
  include_count: 3
  dml_count: 8
  total_blocks: 11
  order_constraint_count: 8
  using_counts:
    insert_policy: 7
    set_identity: 1
    select_lastchanged: 2
    insert_endowment: 9
    insert_house: 7
    insert_motor: 10
    insert_commercial: 20
  call_programs:
    - 'SQL-INSERT-POLICY'
    - 'SQL-SET-IDENTITY'
    - 'SQL-SELECT-LASTCHANGED'
    - 'SQL-INSERT-ENDOWMENT'
    - 'SQL-INSERT-HOUSE'
    - 'SQL-INSERT-MOTOR'
    - 'SQL-INSERT-COMMERCIAL'
