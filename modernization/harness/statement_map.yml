# ---------------------------------------------------------------------------
# statement_map.yml - EXEC SQL block map for base/src/lgapdb01.cbl
#
# Machine-readable map consumed by modernization/harness/translate.py. Each
# entry names one EXEC SQL block in the read-only source program and the
# construct that replaces that block in the generated copy written to
# modernization/harness/build/. translate.py fails when a block found in the
# source cannot be matched to an entry in this file.
#
# Coverage: all 11 EXEC SQL blocks of base/src/lgapdb01.cbl - 3 INCLUDE
# blocks under `includes` and 8 DML blocks under `dml`. Line numbers are
# 1-based and refer to base/src/lgapdb01.cbl, which is read-only and remains
# byte-identical; nothing here edits it.
#
# `terminating_period` records whether the block's END-EXEC line carries a
# trailing period. The last statement of the generated replacement inherits
# that period.
#
# `using` lists the host variables of a DML block in source order. Each item
# carries the host name exactly as the source spells it, the DB2 column it is
# paired with, its direction, its PICTURE and the locator of its declaration.
#
# Scope: SQL-block-to-harness-construct mapping only. Warehouse column
# mapping, runtime status, COMMAREA offsets and the landing record are held in
# modernization/extraction/copybook_field_map.yml.
#
# The two interpretation choices encoded by this file - the single-superset
# SQL-INSERT-ENDOWMENT call standing for both source branches, and one map
# covering INCLUDE and DML blocks alike - are recorded as rows in
# modernization/docs/decision-log.md. Harness topology is Figure 5
# "Validation Harness Control Flow" in modernization/docs/architecture.md.
# ---------------------------------------------------------------------------
version: 1

