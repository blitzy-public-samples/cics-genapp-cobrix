  - id: 'include_lgpolicy'
    include_name: 'LGPOLICY'
    start_line: 75
    end_line: 77
    terminating_period: true
    replacement: 'COPY LGPOLICY.'
    resolves_to: 'lgpolicy.cpy'
  # WORKING-STORAGE: SQL communications area. The generated copy resolves to
  # the harness copybook hsqlca.cpy.
  - id: 'include_sqlca'
    include_name: 'SQLCA'
    start_line: 124
    end_line: 126
    terminating_period: true
    replacement: 'COPY HSQLCA.'
    resolves_to: 'hsqlca.cpy'
